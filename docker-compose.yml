services:
  traefik:
    image: ghcr.io/traefik/traefik:3.4
    container_name: traefik
    restart: always
    # Environment variables for Cloudflare/Let's Encrypt are not needed for local HTTP
    # environment:
    #   - CLOUDFLARE_EMAIL=${CLOUDFLARE_EMAIL}
    #   - CLOUDFLARE_DNS_API_TOKEN=${CLOUDFLARE_DNS_API_TOKEN}
    #   - CLOUDFLARE_ZONE_API_TOKEN=${CLOUDFLARE_ZONE_API_TOKEN}
    #   - LETS_ENCRYPT_EMAIL=${LETS_ENCRYPT_EMAIL}
    command:
      - --api.dashboard=true      # Enable the dashboard
      - --api.insecure=true       # Expose the dashboard without authentication (ONLY FOR LOCAL DEV)
      - --ping=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80 # Only HTTP entrypoint
      # Redirections are not needed without web-secure
      # - --entrypoints.web.http.redirections.entryPoint.to=web-secure
      # - --entrypoints.web.http.redirections.entryPoint.scheme=https
      # - --entrypoints.web.http.redirections.entrypoint.permanent=true
      - --experimental.plugins.rewrite-body.modulename=github.com/packruler/rewrite-body
      - --experimental.plugins.rewrite-body.version=v1.2.0
      - --experimental.plugins.rewriteHeaders.modulename=github.com/XciD/traefik-plugin-rewrite-headers
      - --experimental.plugins.rewriteHeaders.version=v0.0.3
      # Certificate resolvers are not needed for local HTTP
      # - --certificatesresolvers.myresolver.acme.dnschallenge=${DNS_CHALLENGE:-true}
      # - --certificatesresolvers.myresolver.acme.dnschallenge.provider=${DNS_CHALLENGE_PROVIDER:-cloudflare}
      # - --certificatesresolvers.myresolver.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53
      # - --certificatesresolvers.myresolver.acme.caserver=${LETS_ENCRYPT_CA_SERVER:-https://acme-v02.api.letsencrypt.org/directory}
      # - --certificatesresolvers.myresolver.acme.email=${LETS_ENCRYPT_EMAIL}
      # - --certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json
    ports:
      - "80:80"     # Expose HTTP port
      - "8080:8080" # Expose Traefik dashboard
    volumes:
      # /letsencrypt volume not needed for local HTTP
      # - ${CONFIG_ROOT:-.}/letsencrypt:/letsencrypt
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    # extra_hosts is generally not needed with Docker's internal DNS resolution
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 1m
      retries: 10
    labels:
      # Optional: labels for dashboard routing via hostname if you prefer
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.localhost`) && (PathPrefix(`/api`) || PathPrefix(`/dashboard`))"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.entrypoints=web"
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    environment:
      - HOMEPAGE_VAR_TITLE=${HOMEPAGE_VAR_TITLE}
      - HOMEPAGE_VAR_SEARCH_PROVIDER=${HOMEPAGE_VAR_SEARCH_PROVIDER}
      - HOMEPAGE_VAR_HEADER_STYLE=${HOMEPAGE_VAR_HEADER_STYLE}
      - HOMEPAGE_VAR_WEATHER_CITY=${HOMEPAGE_VAR_WEATHER_CITY}
      - HOMEPAGE_VAR_WEATHER_LAT=${HOMEPAGE_VAR_WEATHER_LAT}
      - HOMEPAGE_VAR_WEATHER_LONG=${HOMEPAGE_VAR_WEATHER_LONG}
      - HOMEPAGE_VAR_WEATHER_TIME=${TIMEZONE}
      - HOMEPAGE_VAR_WEATHER_UNIT=${HOMEPAGE_VAR_WEATHER_UNIT}
      - HOMEPAGE_ALLOWED_HOSTS=${HOSTNAME_LOCAL} # Adjusted for local hostname
    volumes:
      - ${CONFIG_ROOT:-.}/homepage:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${DATA_ROOT}:/data
    restart: always
    command: sh -c "cp -n /app/config/tpl/*.yaml /app/config && node server.js"
    labels:
      - traefik.enable=true
      - traefik.http.routers.homepage.rule=Host(`${HOSTNAME_LOCAL}`) && PathPrefix(`/`)
      # Removed TLS configuration
      # - traefik.http.routers.homepage.tls=true
      # - traefik.http.routers.homepage.tls.certresolver=myresolver
      - traefik.http.routers.homepage.entrypoints=web
      - traefik.http.services.homepage.loadbalancer.server.port=3000

  sonarr:
    image: lscr.io/linuxserver/sonarr
    container_name: sonarr
    environment:
      - PUID=${USER_ID}
      - PGID=${GROUP_ID}
      - TZ=${TIMEZONE}
    volumes:
      - ${CONFIG_ROOT:-.}/sonarr:/config
      - ${DATA_ROOT}:/data
    restart: always
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8989/sonarr/ping"]
      interval: 1m
      retries: 10
    ports:
      - "8989:8989" # TEMPORARY: Remove this line after configuration
    labels:
      - traefik.enable=true
      - traefik.http.routers.sonarr.rule=Host(`${HOSTNAME_LOCAL}`) && PathPrefix(`/sonarr`)
      # Removed TLS configuration
      # - traefik.http.routers.sonarr.tls=true
      # - traefik.http.routers.sonarr.tls.certresolver=myresolver
      - traefik.http.routers.sonarr.entrypoints=web # Use the 'web' entrypoint
      - traefik.http.services.sonarr.loadbalancer.server.port=8989
      - homepage.group=Media
      - homepage.name=Sonarr
      - homepage.icon=sonarr.png
      - homepage.href=/sonarr
      - homepage.description=Series management
      - homepage.weight=0
      - homepage.widget.type=sonarr
      - homepage.widget.url=http://sonarr:8989/sonarr # Internal HTTP URL for widget
      - homepage.widget.key=${SONARR_API_KEY}

networks:
  default:
    name: docker-compose-nas